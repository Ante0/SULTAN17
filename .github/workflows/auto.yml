name: Nightly Build

on:
  schedule:
    - cron: "0 2 * * *"

  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.check.outputs.matrix }}
      source_sha: ${{ steps.check.outputs.source_sha }}
      ksu_sha: ${{ steps.check.outputs.ksu_sha }}
      next_sha: ${{ steps.check.outputs.next_sha }}
      susfs_sha: ${{ steps.check.outputs.susfs_sha }}
      nomount_sha: ${{ steps.check.outputs.nomount_sha }}
      vpnhide_sha: ${{ steps.check.outputs.vpnhide_sha }} 
      release_notes: ${{ steps.check.outputs.release_notes }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq gh

      - name: Prepare scripts
        run: chmod +x gscripts/*.sh

      - id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gscripts/check-upstream.sh

  build:
    needs: check

    if: ${{ fromJson(needs.check.outputs.matrix).include[0] != null }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.check.outputs.matrix) }}

    uses: ./.github/workflows/build.yml

    with:
      branch: €{{ matrix.branch }}
      target: ${{ matrix.target }}
      variant: ${{ matrix.variant }}

    secrets: inherit

  release:
    needs:
      - check
      - build

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package release ZIPs
        run: |
          mkdir -p dist

          for AKDIR in artifacts/Sultan_*; do
            [[ -d "$AKDIR" ]] || continue

            NAME="$(basename "$AKDIR")"

            (
              cd "$AKDIR"
              zip -r9 "../../dist/${NAME}.zip" . \
                -x ".git/*" \
                -x ".github/*" \
                -x "*.zip" \
                -x "README.md"
            )
          done

          ls -lh dist

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Prepare scripts
        run: chmod +x scripts/*.sh

      - name: Update Nightly release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ needs.check.outputs.release_notes }}
        run: |
          ./gscripts/release-nightly.sh \
            "${{ needs.check.outputs.source_sha }}" \
            "${{ needs.check.outputs.ksu_sha }}" \
            "${{ needs.check.outputs.next_sha }}" \
            "${{ needs.check.outputs.susfs_sha }}" \
            "${{ needs.check.outputs.nomount_sha }}" \
            "${{ needs.check.outputs.vpnhide_sha }}" \
            "$RELEASE_NOTES"
            
